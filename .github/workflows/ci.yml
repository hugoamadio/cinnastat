name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: unit tests
        run: node --test test/*.test.js
      - name: applet parses
        run: node --check files/cinnastat@hugoamadio/applet.js
      - name: json files are valid
        run: for f in info.json files/cinnastat@hugoamadio/*.json; do python3 -m json.tool "$f" > /dev/null || exit 1; done
      - name: shellcheck
        run: shellcheck -s sh install.sh
